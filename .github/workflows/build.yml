name: Build T42 Firmware

on:
  push:
    branches:
      - ci/epaper-t42-v2.4.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-t42:
    name: Build bread-compact-esp32-epaper-t42
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply T42 display pipeline fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          hp = Path('main/boards/bread-compact-esp32/epaper_display_t42.h')
          h = hp.read_text()
          anchor = "    volatile bool stream_error_ = false;\n"
          assert anchor in h
          h = h.replace(anchor, anchor +
              "    int stream_rows_ = 0;\n"
              "    int stream_flushes_ = 0;\n"
              "    int stream_next_y_ = 0;\n", 1)

          anchor = "    bool WaitBusyRelease(const char* reason, uint32_t timeout_ms);\n"
          assert anchor in h
          h = h.replace(anchor,
              "    bool WaitBusyCycle(const char* reason, uint32_t assert_timeout_ms, uint32_t release_timeout_ms);\n" +
              anchor, 1)
          hp.write_text(h)

          sp = Path('main/boards/bread-compact-esp32/epaper_display_t42.cc')
          s = sp.read_text()

          anchor = "        area->x1 != 0 || area->x2 != (EPD_WIDTH - 1)) {\n"
          assert anchor in s
          s = s.replace(anchor,
              "        area->x1 != 0 || area->x2 != (EPD_WIDTH - 1) ||\n"
              "        area->y1 < 0 || area->y2 >= EPD_HEIGHT) {\n", 1)

          anchor = "    auto* pixels = reinterpret_cast<uint16_t*>(color_p);\n"
          assert anchor in s
          s = s.replace(anchor,
              "    if (area->y1 != self->stream_next_y_) {\n"
              "        ESP_LOGE(TAG, \"Non-contiguous LVGL stream: expected y=%d got %d..%d\",\n"
              "                 self->stream_next_y_, area->y1, area->y2);\n"
              "        self->stream_error_ = true;\n"
              "        lv_display_flush_ready(disp);\n"
              "        return;\n"
              "    }\n\n" + anchor, 1)

          old = (
              "        if (self->SpiWrite(self->mono_line_, MONO_LINE_BYTES) != ESP_OK) {\n"
              "            self->stream_error_ = true;\n"
              "            break;\n"
              "        }\n"
              "    }\n\n"
              "    lv_display_flush_ready(disp);\n"
          )
          new = (
              "        if (self->SpiWrite(self->mono_line_, MONO_LINE_BYTES) != ESP_OK) {\n"
              "            self->stream_error_ = true;\n"
              "            break;\n"
              "        }\n"
              "        ++self->stream_rows_;\n"
              "        ++self->stream_next_y_;\n"
              "    }\n\n"
              "    ++self->stream_flushes_;\n"
              "    lv_display_flush_ready(disp);\n"
          )
          assert old in s
          s = s.replace(old, new, 1)

          new_func = r'''bool EpaperDisplayT42::StreamCurrentUiToPanel(bool invert) {
              if (display_ == nullptr) {
                  return false;
              }

              stream_error_ = false;
              streaming_refresh_ = true;
              stream_invert_ = invert;
              stream_rows_ = 0;
              stream_flushes_ = 0;
              stream_next_y_ = 0;

              lvgl_port_lock(0);
              lv_obj_t* screen = lv_display_get_screen_active(display_);
              if (screen != nullptr) {
                  lv_area_t full_area;
                  full_area.x1 = 0;
                  full_area.y1 = 0;
                  full_area.x2 = EPD_WIDTH - 1;
                  full_area.y2 = EPD_HEIGHT - 1;
                  const lv_result_t inv = lv_obj_invalidate_area(screen, &full_area);
                  if (inv != LV_RESULT_OK) {
                      ESP_LOGE(TAG, "Full-screen LVGL invalidation failed: %d", static_cast<int>(inv));
                      stream_error_ = true;
                  } else {
                      lv_refr_now(display_);
                  }
              } else {
                  stream_error_ = true;
              }
              lvgl_port_unlock();

              const bool complete =
                  !stream_error_ && stream_rows_ == EPD_HEIGHT && stream_next_y_ == EPD_HEIGHT;
              ESP_LOGI(TAG,
                       "LVGL plane stream: invert=%d rows=%d/%d flushes=%d result=%s",
                       invert ? 1 : 0,
                       stream_rows_, EPD_HEIGHT, stream_flushes_,
                       complete ? "complete" : "INCOMPLETE");
              if (!complete) {
                  stream_error_ = true;
              }

              stream_invert_ = false;
              streaming_refresh_ = false;
              return !stream_error_;
          }'''
          new_func = re.sub(r'^          ', '', new_func, flags=re.M)
          pattern = (r'bool EpaperDisplayT42::StreamCurrentUiToPanel\(bool invert\) \{.*?\n\}'
                     r'(?=\n\nesp_err_t EpaperDisplayT42::SpiWrite)')
          s, n = re.subn(pattern, new_func, s, count=1, flags=re.S)
          assert n == 1, 'StreamCurrentUiToPanel replacement failed'

          busy_cycle_func = r'''bool EpaperDisplayT42::WaitBusyCycle(
              const char* reason,
              uint32_t assert_timeout_ms,
              uint32_t release_timeout_ms) {
              TickType_t start = xTaskGetTickCount();
              ESP_LOGI(TAG, "%s: waiting BUSY LOW, current=%d",
                       reason, gpio_get_level(EPD_BUSY_PIN));

              while (gpio_get_level(EPD_BUSY_PIN) != 0) {
                  if ((xTaskGetTickCount() - start) > pdMS_TO_TICKS(assert_timeout_ms)) {
                      ESP_LOGE(TAG,
                               "%s: BUSY never asserted LOW within %u ms (level=%d)",
                               reason,
                               static_cast<unsigned>(assert_timeout_ms),
                               gpio_get_level(EPD_BUSY_PIN));
                      return false;
                  }
                  vTaskDelay(pdMS_TO_TICKS(5));
              }

              const uint32_t assert_elapsed =
                  static_cast<uint32_t>((xTaskGetTickCount() - start) * portTICK_PERIOD_MS);
              ESP_LOGI(TAG, "%s: BUSY LOW after %u ms; waiting release HIGH",
                       reason, static_cast<unsigned>(assert_elapsed));

              start = xTaskGetTickCount();
              while (gpio_get_level(EPD_BUSY_PIN) == 0) {
                  if ((xTaskGetTickCount() - start) > pdMS_TO_TICKS(release_timeout_ms)) {
                      ESP_LOGE(TAG, "%s: BUSY stayed LOW > %u ms",
                               reason, static_cast<unsigned>(release_timeout_ms));
                      return false;
                  }
                  vTaskDelay(pdMS_TO_TICKS(5));
              }

              const uint32_t busy_elapsed =
                  static_cast<uint32_t>((xTaskGetTickCount() - start) * portTICK_PERIOD_MS);
              ESP_LOGI(TAG, "%s: BUSY released HIGH after %u ms",
                       reason, static_cast<unsigned>(busy_elapsed));
              return true;
          }

          '''
          busy_cycle_func = re.sub(r'^          ', '', busy_cycle_func, flags=re.M)
          anchor = "bool EpaperDisplayT42::WaitBusyRelease(const char* reason, uint32_t timeout_ms) {\n"
          assert anchor in s
          s = s.replace(anchor, busy_cycle_func + anchor, 1)

          old = (
              "    SendCommand(0x50); // VCOM / DATA INTERVAL\n"
              "    SendData(0x10);\n"
              "    SendData(0x07);\n"
          )
          new = (
              "    // Waveshare 7.5in V2 alternate path for a gray-looking panel.\n"
              "    SendCommand(0x50); // VCOM / DATA INTERVAL\n"
              "    SendData(0x10);\n"
              "    SendData(0x17);\n\n"
              "    SendCommand(0x52);\n"
              "    SendData(0x03);\n"
          )
          assert old in s
          s = s.replace(old, new, 1)

          old = '    if (!WaitBusyRelease("power-on", 5000)) {\n'
          new = '    if (!WaitBusyRelease("power-on", EPD_BUSY_TIMEOUT_MS)) {\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '    const bool ok = WaitBusyRelease("display-refresh", EPD_BUSY_TIMEOUT_MS);\n\n    SleepAndPowerOff();\n'
          new = (
              '    const bool ok = WaitBusyCycle("display-refresh", 1500, EPD_BUSY_TIMEOUT_MS);\n\n'
              '    if (!ok) {\n'
              '        ESP_LOGE(TAG, "DISPLAY REFRESH BUSY cycle failed; hard power reset");\n'
              '        PowerRail(false);\n'
              '        vTaskDelay(pdMS_TO_TICKS(300));\n'
              '        ESP_LOGI(TAG, "Full refresh failed");\n'
              '        return false;\n'
              '    }\n\n'
              '    SleepAndPowerOff();\n'
          )
          assert old in s
          s = s.replace(old, new, 1)

          old = '    WaitBusyRelease("power-off", 2000);\n'
          new = '    WaitBusyRelease("power-off", EPD_BUSY_TIMEOUT_MS);\n'
          assert old in s
          s = s.replace(old, new, 1)

          sp.write_text(s)
          print('T42 pipeline + BUSY-cycle rewrite applied successfully')
          PY

      - name: Build T42 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-esp32 --name bread-compact-esp32-epaper-t42

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-esp32-epaper-t42_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error