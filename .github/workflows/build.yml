name: Build T42 Firmware

on:
  push:
    branches:
      - ci/epaper-t42-v2.4.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-t42:
    name: Build bread-compact-esp32-epaper-t42
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore diagnostic board source
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin ecb417474d96298c0e0370f38b8b3c8ddad8e8e5
          git checkout FETCH_HEAD -- main/boards/bread-compact-esp32/esp32_bread_board.cc

      - name: Apply safe slow wiring test
        shell: bash
        run: |
          python .github/t42_patch_wiretest.py

      - name: Build T42 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-esp32 --name bread-compact-esp32-epaper-t42

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-esp32-epaper-t42_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
