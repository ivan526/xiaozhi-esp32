name: Build T42 Firmware

on:
  push:
    branches:
      - ci/epaper-t42-v2.4.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-t42:
    name: Build bread-compact-esp32-epaper-t42
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply T42 display pipeline fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          header = Path('main/boards/bread-compact-esp32/epaper_display_t42.h')
          h = header.read_text()
          old = '''    volatile bool streaming_refresh_ = false;
              volatile bool stream_invert_ = false;
              volatile bool stream_error_ = false;
          '''
          new = '''    volatile bool streaming_refresh_ = false;
              volatile bool stream_invert_ = false;
              volatile bool stream_error_ = false;
              volatile int stream_rows_ = 0;
              volatile int stream_flushes_ = 0;
              volatile int stream_next_y_ = 0;
          '''
          assert old in h, 'header stream state block not found'
          header.write_text(h.replace(old, new, 1))

          src = Path('main/boards/bread-compact-esp32/epaper_display_t42.cc')
          s = src.read_text()

          old = '''    if (self->mono_line_ == nullptr ||
                  area->x1 != 0 || area->x2 != (EPD_WIDTH - 1)) {
              ESP_LOGE(TAG, "Unexpected LVGL stream area x=%d..%d y=%d..%d",
                       area->x1, area->x2, area->y1, area->y2);
              self->stream_error_ = true;
              lv_display_flush_ready(disp);
              return;
          }

              auto* pixels = reinterpret_cast<uint16_t*>(color_p);
          '''
          new = '''    if (self->mono_line_ == nullptr ||
                  area->x1 != 0 || area->x2 != (EPD_WIDTH - 1) ||
                  area->y1 < 0 || area->y2 >= EPD_HEIGHT) {
              ESP_LOGE(TAG, "Unexpected LVGL stream area x=%d..%d y=%d..%d",
                       area->x1, area->x2, area->y1, area->y2);
              self->stream_error_ = true;
              lv_display_flush_ready(disp);
              return;
          }

              if (area->y1 != self->stream_next_y_) {
              ESP_LOGE(TAG, "Non-contiguous LVGL stream: expected y=%d got %d..%d",
                       self->stream_next_y_, area->y1, area->y2);
              self->stream_error_ = true;
              lv_display_flush_ready(disp);
              return;
          }

              auto* pixels = reinterpret_cast<uint16_t*>(color_p);
          '''
          assert old in s, 'flush validation block not found'
          s = s.replace(old, new, 1)

          old = '''        if (self->SpiWrite(self->mono_line_, MONO_LINE_BYTES) != ESP_OK) {
                  self->stream_error_ = true;
                  break;
              }
          }

              lv_display_flush_ready(disp);
          '''
          new = '''        if (self->SpiWrite(self->mono_line_, MONO_LINE_BYTES) != ESP_OK) {
                  self->stream_error_ = true;
                  break;
              }

                  ++self->stream_rows_;
              ++self->stream_next_y_;
          }

              ++self->stream_flushes_;
          lv_display_flush_ready(disp);
          '''
          assert old in s, 'flush counter insertion point not found'
          s = s.replace(old, new, 1)

          old = '''bool EpaperDisplayT42::StreamCurrentUiToPanel(bool invert) {
              if (display_ == nullptr) {
                  return false;
              }

              stream_error_ = false;
              streaming_refresh_ = true;
              stream_invert_ = invert;

              lvgl_port_lock(0);
              lv_obj_t* screen = lv_display_get_screen_active(display_);
              if (screen != nullptr) {
                  lv_obj_invalidate(screen);
                  lv_refr_now(display_);
              } else {
                  stream_error_ = true;
              }
              lvgl_port_unlock();

              stream_invert_ = false;
              streaming_refresh_ = false;
              return !stream_error_;
          }
          '''
          new = '''bool EpaperDisplayT42::StreamCurrentUiToPanel(bool invert) {
              if (display_ == nullptr) {
                  return false;
              }

              stream_error_ = false;
              streaming_refresh_ = true;
              stream_invert_ = invert;
              stream_rows_ = 0;
              stream_flushes_ = 0;
              stream_next_y_ = 0;

              lvgl_port_lock(0);
              lv_obj_t* screen = lv_display_get_screen_active(display_);
              if (screen != nullptr) {
                  lv_area_t full_area;
                  full_area.x1 = 0;
                  full_area.y1 = 0;
                  full_area.x2 = EPD_WIDTH - 1;
                  full_area.y2 = EPD_HEIGHT - 1;
                  const lv_result_t inv = lv_obj_invalidate_area(screen, &full_area);
                  if (inv != LV_RESULT_OK) {
                      ESP_LOGE(TAG, "Full-screen LVGL invalidation failed: %d", static_cast<int>(inv));
                      stream_error_ = true;
                  } else {
                      lv_refr_now(display_);
                  }
              } else {
                  stream_error_ = true;
              }
              lvgl_port_unlock();

              const bool complete =
                  !stream_error_ && stream_rows_ == EPD_HEIGHT && stream_next_y_ == EPD_HEIGHT;
              ESP_LOGI(TAG,
                       "LVGL plane stream: invert=%d rows=%d/%d flushes=%d result=%s",
                       invert ? 1 : 0,
                       stream_rows_,
                       EPD_HEIGHT,
                       stream_flushes_,
                       complete ? "complete" : "INCOMPLETE");
              if (!complete) {
                  stream_error_ = true;
              }

              stream_invert_ = false;
              streaming_refresh_ = false;
              return !stream_error_;
          }
          '''
          assert old in s, 'StreamCurrentUiToPanel block not found'
          s = s.replace(old, new, 1)

          old = '''    SendCommand(0x50); // VCOM / DATA INTERVAL
              SendData(0x10);
              SendData(0x07);
          '''
          new = '''    // Alternate VCOM/data interval sequence recommended by Waveshare's
              // official 7.5in V2 driver when the panel appears gray.
              SendCommand(0x50); // VCOM / DATA INTERVAL (gray-panel path)
              SendData(0x10);
              SendData(0x17);

              SendCommand(0x52);
              SendData(0x03);
          '''
          assert old in s, 'VCOM block not found'
          src.write_text(s.replace(old, new, 1))
          PY

      - name: Build T42 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-esp32 --name bread-compact-esp32-epaper-t42

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-esp32-epaper-t42_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
